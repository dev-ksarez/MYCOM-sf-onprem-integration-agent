name: Publish Confluence Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/confluence/**"
      - ".github/workflows/publish-confluence-docs.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish Markdown to Confluence
        uses: markdown-confluence/publish-action@v5
        with:
          confluenceBaseUrl: ${{ vars.CONFLUENCE_BASE_URL || 'https://mycom.atlassian.net/wiki' }}
          confluenceParentId: ${{ vars.CONFLUENCE_PARENT_ID || '4399431685' }}
          atlassianUserName: ${{ secrets.ATLASSIAN_USERNAME }}
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          folderToPublish: docs/confluence
          contentRoot: docs/confluence
