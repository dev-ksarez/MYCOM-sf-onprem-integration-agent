name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "runtime_zip_name=sf-onprem-integration-agent-installer-runtime-assets.zip" >> "$GITHUB_OUTPUT"
          echo "installer_zip_name=sf-onprem-integration-agent-installer.zip" >> "$GITHUB_OUTPUT"

      - name: Align package version with tag
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n');" "$VERSION"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));console.log('package.json version=' + j.version)"

      - name: Create customer installer ZIP
        id: customer_zip
        run: |
          set -e
          RELEASE_DIR="artifacts"
          mkdir -p "$RELEASE_DIR"
          rm -f "$RELEASE_DIR"/sf-onprem-integration-agent-customer-installer-*.zip
          node scripts/windows/build-customer-package.js --output-dir "$RELEASE_DIR" --include-node-modules
          ZIP_PATH=$(ls -1 "$RELEASE_DIR"/sf-onprem-integration-agent-customer-installer-*.zip | head -n 1)
          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERROR: Customer ZIP not created at $ZIP_PATH"
            exit 1
          fi
          ZIP_NAME="$(basename "$ZIP_PATH")"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create runtime update package ZIP
        id: runtime_zip
        run: |
          set -e
          RELEASE_DIR="artifacts"
          RUNTIME_ZIP_PATH="$RELEASE_DIR/${{ steps.version.outputs.runtime_zip_name }}"
          if [ ! -f "${{ steps.customer_zip.outputs.zip_path }}" ]; then
            echo "ERROR: Customer ZIP not found: ${{ steps.customer_zip.outputs.zip_path }}"
            exit 1
          fi
          cp "${{ steps.customer_zip.outputs.zip_path }}" "$RUNTIME_ZIP_PATH"
          echo "zip_path=$RUNTIME_ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 of package
        id: sha
        run: |
          set -e
          HASH=$(sha256sum "${{ steps.runtime_zip.outputs.zip_path }}" | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Write update manifest
        id: manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.customer_zip.outputs.zip_name }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          RELEASE_DIR="artifacts"
          mkdir -p "$RELEASE_DIR"
          MANIFEST_FILE="$RELEASE_DIR/update-manifest.json"
          cat > "$MANIFEST_FILE" <<EOF
          {
            "version": "${VERSION}",
            "packageUrl": "https://github.com/${REPO}/releases/download/${TAG}/${ZIP_NAME}",
            "sha256": "${SHA256}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "manifest_path=$MANIFEST_FILE" >> "$GITHUB_OUTPUT"

      - name: Create initial installer ZIP
        id: installer_zip
        run: |
          RELEASE_DIR="artifacts"
          INSTALLER="$RELEASE_DIR/${{ steps.version.outputs.installer_zip_name }}"
          zip -r "$INSTALLER" scripts/ .env.example
          echo "installer_path=$INSTALLER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## Installation

            ### Erstinstallation (einmalig beim Kunden)
            1. `${{ steps.customer_zip.outputs.zip_path }}` herunterladen und entpacken
            2. `install-customer-package.cmd` oder `install-customer-package.ps1` als Admin ausführen
            3. `.env` aus `.env.example` anlegen und befüllen, falls der Installer sie nicht interaktiv erzeugt
            4. Als Admin: `npm run win:register-updater` mit der Manifest-URL ausführen, falls der Updater nicht bereits registriert wurde:
               ```
               https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
               ```

            ### Update-Manifest URL (für Updater-Konfiguration)
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
            ```

            ### Manuelles Update
            ```powershell
            powershell -File scripts\windows\update-agent.ps1 `
              -UpdateManifestUrl "https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json"
            ```
          files: |
            ${{ steps.customer_zip.outputs.zip_path }}
            ${{ steps.runtime_zip.outputs.zip_path }}
            ${{ steps.manifest.outputs.manifest_path }}
            ${{ steps.installer_zip.outputs.installer_path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-release-notes-to-confluence:
    needs: build-and-release
    uses: ./.github/workflows/publish-confluence-docs.yml
    secrets: inherit
    with:
      release_version: ${{ github.ref_name }}
